<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Filmes HD - Cadastro de Sessões</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body data-bs-theme="dark">
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./img/iconCine.svg" alt="" class="d-inline-block align-text-top me-1">
        Mega Filmes HD
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="cadastro-filmes.html" class="nav-link">Filmes</a></li>
          <li class="nav-item"><a href="cadastro-salas.html" class="nav-link">Salas</a></li>
          <li class="nav-item"><a href="cadastro-sessoes.html" class="nav-link active">Sessões</a></li>
          <li class="nav-item"><a href="venda-ingressos.html" class="nav-link">Ingressos</a></li>
          <li class="nav-item"><a href="sessoes.html" class="nav-link">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1><span class="badge text-bg-warning">Cadastro de Sessões</span></h1>
  </div>

  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Filme</label>
        <select class="form-select" id="selectFilme">
          <option value="">Selecione um filme</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Sala</label>
        <select class="form-select" id="selectSala">
          <option value="">Selecione uma sala</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Data e Hora</label>
        <input type="datetime-local" class="form-control" id="dataHora">
      </div>
      <div class="col-md-6">
        <label class="form-label">Preço (R$)</label>
        <input type="text" class="form-control" id="preco" placeholder="0.00" oninput="mascaraMoeda(this)">
      </div>
      <div class="col-md-6">
        <label class="form-label">Idioma</label>
        <select class="form-select" id="idioma">
          <option value="">Selecione o idioma</option>
          <option>Dublado</option>
          <option>Legendado</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Formato</label>
        <select class="form-select" id="formato">
          <option value="">Selecione o formato</option>
          <option>2D</option>
          <option>3D</option>
          <option>IMAX</option>
        </select>
      </div>
      <div class="col-12">
        <button id="btnSalvarSessao" class="btn btn-warning" onclick="salvarSessao()">Salvar Sessão</button>
      </div>
    </div>

    <div id="alerta" class="mt-3"></div>

    <hr class="border-secondary mt-5">
    <h5 class="mt-4" style="color:#a0c878">Sessões Cadastradas</h5>
    <div id="listaSessoes" class="mt-3"></div>
  </div>

  <footer class="mt-5 py-4 border-top">
    <div class="container text-center">
      <p class="text-secondary small mb-0">&copy; 2026 Mega Filmes HD</p>
    </div>
  </footer>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/Script.js"></script>
  <script>
    carregarSelectsSessao();
    renderSessoesCadastro();
  </script>
</body>

</html>
