<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Filmes HD - Cadastro de Sessões</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body data-bs-theme="dark" class="bg-dark">

  <nav class="navbar bg-black navbar-expand-lg border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 text-warning" href="index.html">Mega Filmes HD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link text-warning">Home</a></li>
          <li class="nav-item"><a href="cadastro-filmes.html" class="nav-link text-warning">Filmes</a></li>
          <li class="nav-item"><a href="cadastro-salas.html" class="nav-link text-warning">Salas</a></li>
          <li class="nav-item"><a href="cadastro-sessoes.html" class="nav-link text-warning active">Sessões</a></li>
          <li class="nav-item"><a href="venda-ingressos.html" class="nav-link text-warning">Ingressos</a></li>
          <li class="nav-item"><a href="sessoes.html" class="nav-link text-warning">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1><span class="badge text-bg-warning">Cadastro de Sessões</span></h1>
  </div>

  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Filme</label>
        <select class="form-select" id="selectFilme">
          <option value="">Selecione um filme</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Sala</label>
        <select class="form-select" id="selectSala">
          <option value="">Selecione uma sala</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Data e Hora</label>
        <input type="datetime-local" class="form-control" id="dataHora">
      </div>
      <div class="col-md-6">
        <label class="form-label">Preço (R$)</label>
        <input type="number" step="0.01" min="0" class="form-control" id="preco" placeholder="Ex: 25.00">
      </div>
      <div class="col-md-6">
        <label class="form-label">Idioma</label>
        <select class="form-select" id="idioma">
          <option value="">Selecione o idioma</option>
          <option>Dublado</option>
          <option>Legendado</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Formato</label>
        <select class="form-select" id="formato">
          <option value="">Selecione o formato</option>
          <option>2D</option>
          <option>3D</option>
        </select>
      </div>
      <div class="col-12">
        <button class="btn btn-warning" onclick="salvarSessao()">Salvar Sessão</button>
      </div>
    </div>

    <div id="alerta" class="mt-3"></div>

    <hr class="border-secondary mt-5">
    <h5 class="mt-4">Sessões Cadastradas</h5>
    <div id="listaSessoes" class="mt-3"></div>
  </div>

  <footer class="mt-5 py-4 border-top border-secondary">
    <div class="container text-center">
      <p class="text-secondary small mb-0">&copy; 2026 Mega Filmes HD Cinema</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function carregarSelects() {
      const filmes = JSON.parse(localStorage.getItem('filmes') || '[]');
      const salas = JSON.parse(localStorage.getItem('salas') || '[]');
      const selectFilme = document.getElementById('selectFilme');
      const selectSala = document.getElementById('selectSala');

      filmes.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = f.titulo;
        selectFilme.appendChild(opt);
      });

      salas.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.nomeSala} (${s.tipo})`;
        selectSala.appendChild(opt);
      });
    }

    function salvarSessao() {
      const filmeId = document.getElementById('selectFilme').value;
      const salaId = document.getElementById('selectSala').value;
      const dataHora = document.getElementById('dataHora').value;
      const preco = document.getElementById('preco').value;
      const idioma = document.getElementById('idioma').value;
      const formato = document.getElementById('formato').value;

      if (!filmeId || !salaId || !dataHora || !preco || !idioma || !formato) {
        mostrarAlerta('Preencha todos os campos.', 'danger');
        return;
      }

      const filmes = JSON.parse(localStorage.getItem('filmes') || '[]');
      const salas = JSON.parse(localStorage.getItem('salas') || '[]');
      const filme = filmes.find(f => f.id == filmeId);
      const sala = salas.find(s => s.id == salaId);

      const sessoes = JSON.parse(localStorage.getItem('sessoes') || '[]');
      sessoes.push({
        id: Date.now(),
        filmeId, salaId,
        filmeTitulo: filme.titulo,
        salaNome: sala.nomeSala,
        dataHora, preco, idioma, formato
      });

      try {
        localStorage.setItem('sessoes', JSON.stringify(sessoes));
        mostrarAlerta('Sessão salva com sucesso!', 'success');
        limparForm();
        renderLista();
      } catch (e) {
        mostrarAlerta('Erro ao salvar: armazenamento cheio.', 'danger');
      }
    }

    function mostrarAlerta(msg, tipo) {
      document.getElementById('alerta').innerHTML =
        `<div class="alert alert-${tipo} alert-dismissible" role="alert">
                    ${msg}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
    }

    function limparForm() {
      ['selectFilme', 'selectSala', 'dataHora', 'preco', 'idioma', 'formato']
        .forEach(id => document.getElementById(id).value = '');
    }

    function renderLista() {
      const sessoes = JSON.parse(localStorage.getItem('sessoes') || '[]');
      const el = document.getElementById('listaSessoes');

      if (!sessoes.length) {
        el.innerHTML = '<p class="text-secondary">Nenhuma sessão cadastrada.</p>';
        return;
      }

      el.innerHTML = `
                <table class="table table-dark table-striped table-hover">
                    <thead><tr>
                        <th>Filme</th><th>Sala</th><th>Data e Hora</th><th>Preço</th><th>Idioma</th><th>Formato</th>
                    </tr></thead>
                    <tbody>
                        ${sessoes.map(s => `
                            <tr>
                                <td>${s.filmeTitulo}</td>
                                <td>${s.salaNome}</td>
                                <td>${s.dataHora.replace('T', ' ')}</td>
                                <td>R$ ${parseFloat(s.preco).toFixed(2)}</td>
                                <td>${s.idioma}</td>
                                <td>${s.formato}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
    }

    carregarSelects();
    renderLista();
  </script>
</body>

</html>
