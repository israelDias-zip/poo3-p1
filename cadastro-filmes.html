<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Filmes HD - Cadastro de Filmes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body data-bs-theme="dark" class="bg-dark">

  <nav class="navbar bg-black navbar-expand-lg border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 text-warning" href="index.html">Mega Filmes HD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link text-warning">Home</a></li>
          <li class="nav-item"><a href="cadastro-filmes.html" class="nav-link text-warning active">Filmes</a></li>
          <li class="nav-item"><a href="cadastro-salas.html" class="nav-link text-warning">Salas</a></li>
          <li class="nav-item"><a href="cadastro-sessoes.html" class="nav-link text-warning">Sessões</a></li>
          <li class="nav-item"><a href="venda-ingressos.html" class="nav-link text-warning">Ingressos</a></li>
          <li class="nav-item"><a href="sessoes.html" class="nav-link text-warning">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1><span class="badge text-bg-warning">Cadastro de Filmes</span></h1>
  </div>

  <div class="container mt-4">
    <div class="row g-3" id="formFilme">
      <div class="col-md-6">
        <label class="form-label">Título</label>
        <input type="text" class="form-control" id="titulo" placeholder="Título do filme">
      </div>
      <div class="col-md-6">
        <label class="form-label">Gênero</label>
        <select class="form-select" id="genero">
          <option value="">Selecione o gênero</option>
          <option>Ação</option>
          <option>Aventura</option>
          <option>Comédia</option>
          <option>Drama</option>
          <option>Ficção Científica</option>
          <option>Romance</option>
          <option>Terror</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" rows="3" placeholder="Sinopse do filme"></textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Classificação Indicativa</label>
        <select class="form-select" id="classificacao">
          <option value="">Selecione</option>
          <option>Livre</option>
          <option>10 anos</option>
          <option>12 anos</option>
          <option>14 anos</option>
          <option>16 anos</option>
          <option>18 anos</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Duração (minutos)</label>
        <input type="number" class="form-control" id="duracao" placeholder="Ex: 120" min="1">
      </div>
      <div class="col-md-4">
        <label class="form-label">Data de Estreia</label>
        <input type="date" class="form-control" id="estreia">
      </div>
      <div class="col-12">
        <button class="btn btn-warning" onclick="salvarFilme()">Salvar Filme</button>
      </div>
    </div>

    <div id="alerta" class="mt-3"></div>

    <hr class="border-secondary mt-5">
    <h5 class="mt-4">Filmes Cadastrados</h5>
    <div id="listaFilmes" class="mt-3"></div>
  </div>

  <footer class="mt-5 py-4 border-top border-secondary">
    <div class="container text-center">
      <p class="text-secondary small mb-0">&copy; 2026 Mega Filmes HD Cinema</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function salvarFilme() {
      const titulo = document.getElementById('titulo').value.trim();
      const genero = document.getElementById('genero').value;
      const descricao = document.getElementById('descricao').value.trim();
      const classificacao = document.getElementById('classificacao').value;
      const duracao = document.getElementById('duracao').value;
      const estreia = document.getElementById('estreia').value;

      if (!titulo || !genero || !classificacao || !duracao || !estreia) {
        mostrarAlerta('Preencha todos os campos obrigatórios.', 'danger');
        return;
      }

      const filmes = JSON.parse(localStorage.getItem('filmes') || '[]');
      filmes.push({ id: Date.now(), titulo, genero, descricao, classificacao, duracao, estreia });

      try {
        localStorage.setItem('filmes', JSON.stringify(filmes));
        mostrarAlerta('Filme salvo com sucesso!', 'success');
        limparForm();
        renderLista();
      } catch (e) {
        mostrarAlerta('Erro ao salvar: armazenamento cheio.', 'danger');
      }
    }

    function mostrarAlerta(msg, tipo) {
      document.getElementById('alerta').innerHTML =
        `<div class="alert alert-${tipo} alert-dismissible" role="alert">
            ${msg}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }

    function limparForm() {
      ['titulo', 'genero', 'descricao', 'classificacao', 'duracao', 'estreia']
        .forEach(id => document.getElementById(id).value = '');
    }

    function renderLista() {
      const filmes = JSON.parse(localStorage.getItem('filmes') || '[]');
      const el = document.getElementById('listaFilmes');

      if (!filmes.length) {
        el.innerHTML = '<p class="text-secondary">Nenhum filme cadastrado.</p>';
        return;
      }

    el.innerHTML = `
      <table class="table table-dark table-striped table-hover">
          <thead><tr>
              <th>Título</th><th>Gênero</th><th>Classificação</th><th>Duração</th><th>Estreia</th>
          </tr></thead>
          <tbody>
              ${filmes.map(f => `
                  <tr>
                      <td>${f.titulo}</td>
                      <td>${f.genero}</td>
                      <td>${f.classificacao}</td>
                      <td>${f.duracao} min</td>
                      <td>${f.estreia}</td>
                  </tr>`).join('')}
          </tbody>
      </table>`;
    }

    renderLista();
  </script>
</body>

</html>
