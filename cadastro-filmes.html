<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Filmes HD - Cadastro de Filmes</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body data-bs-theme="dark">
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./img/iconCine.svg" alt="" class="d-inline-block align-text-top me-1">
        Mega Filmes HD
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="cadastro-filmes.html" class="nav-link active">Filmes</a></li>
          <li class="nav-item"><a href="cadastro-salas.html" class="nav-link">Salas</a></li>
          <li class="nav-item"><a href="cadastro-sessoes.html" class="nav-link">Sessões</a></li>
          <li class="nav-item"><a href="venda-ingressos.html" class="nav-link">Ingressos</a></li>
          <li class="nav-item"><a href="sessoes.html" class="nav-link">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1><span class="badge text-bg-warning">Cadastro de Filmes</span></h1>
  </div>

  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Título</label>
        <input type="text" class="form-control" id="titulo" placeholder="Título do filme">
      </div>
      <div class="col-md-6">
        <label class="form-label">Gênero</label>
        <select class="form-select" id="genero">
          <option value="">Selecione o gênero</option>
          <option>Ação</option>
          <option>Aventura</option>
          <option>Comédia</option>
          <option>Drama</option>
          <option>Ficção Científica</option>
          <option>Romance</option>
          <option>Terror</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" rows="3" placeholder="Sinopse do filme"></textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Classificação Indicativa</label>
        <select class="form-select" id="classificacao">
          <option value="">Selecione</option>
          <option>Livre</option>
          <option>10 anos</option>
          <option>12 anos</option>
          <option>14 anos</option>
          <option>16 anos</option>
          <option>18 anos</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Duração (minutos)</label>
        <input type="number" class="form-control" id="duracao" placeholder="Ex: 120" min="1">
      </div>
      <div class="col-md-4">
        <label class="form-label">Data de Estreia</label>
        <input type="date" class="form-control" id="estreia">
      </div>
      <div class="col-12">
        <button id="btnSalvarFilme" class="btn btn-warning" onclick="salvarFilme()">Salvar Filme</button>
      </div>
    </div>

    <div id="alerta" class="mt-3"></div>

    <hr class="border-secondary mt-5">
    <h5 class="mt-4" style="color:#a0c878">Filmes Cadastrados</h5>
    <div id="listaFilmes" class="mt-3"></div>
  </div>

  <footer class="mt-5 py-4 border-top">
    <div class="container text-center">
      <p class="text-secondary small mb-0">&copy; 2026 Mega Filmes HD</p>
    </div>
  </footer>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/Script.js"></script>
  <script>renderFilmes();</script>
</body>

</html>
