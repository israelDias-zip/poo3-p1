<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Filmes HD - Cadastro de Salas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body data-bs-theme="dark" class="bg-dark">

  <nav class="navbar bg-black navbar-expand-lg border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 text-warning" href="index.html">Mega Filmes HD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link text-warning">Home</a></li>
          <li class="nav-item"><a href="cadastro-filmes.html" class="nav-link text-warning">Filmes</a></li>
          <li class="nav-item"><a href="cadastro-salas.html" class="nav-link text-warning active">Salas</a></li>
          <li class="nav-item"><a href="cadastro-sessoes.html" class="nav-link text-warning">Sessões</a></li>
          <li class="nav-item"><a href="venda-ingressos.html" class="nav-link text-warning">Ingressos</a></li>
          <li class="nav-item"><a href="sessoes.html" class="nav-link text-warning">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1><span class="badge text-bg-warning">Cadastro de Salas</span></h1>
  </div>

  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome da Sala</label>
        <input type="text" class="form-control" id="nomeSala" placeholder="Ex: Sala 1">
      </div>
      <div class="col-md-3">
        <label class="form-label">Capacidade</label>
        <input type="number" class="form-control" id="capacidade" placeholder="Ex: 80" min="1">
      </div>
      <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="tipo">
          <option value="">Selecione o tipo</option>
          <option>2D</option>
          <option>3D</option>
          <option>IMAX</option>
        </select>
      </div>
      <div class="col-12">
        <button class="btn btn-warning" onclick="salvarSala()">Salvar Sala</button>
      </div>
    </div>

    <div id="alerta" class="mt-3"></div>

    <hr class="border-secondary mt-5">
    <h5 class="mt-4">Salas Cadastradas</h5>
    <div id="listaSalas" class="mt-3"></div>
  </div>

  <footer class="mt-5 py-4 border-top border-secondary">
    <div class="container text-center">
      <p class="text-secondary small mb-0">&copy; 2026 Mega Filmes HD Cinema</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function salvarSala() {
      const nomeSala = document.getElementById('nomeSala').value.trim();
      const capacidade = document.getElementById('capacidade').value;
      const tipo = document.getElementById('tipo').value;

      if (!nomeSala || !capacidade || !tipo) {
        mostrarAlerta('Preencha todos os campos.', 'danger');
        return;
      }

      const salas = JSON.parse(localStorage.getItem('salas') || '[]');
      salas.push({ id: Date.now(), nomeSala, capacidade, tipo });

      try {
        localStorage.setItem('salas', JSON.stringify(salas));
        mostrarAlerta('Sala salva com sucesso!', 'success');
        limparForm();
        renderLista();
      } catch (e) {
        mostrarAlerta('Erro ao salvar: armazenamento cheio.', 'danger');
      }
    }

    function mostrarAlerta(msg, tipo) {
      document.getElementById('alerta').innerHTML =
        `<div class="alert alert-${tipo} alert-dismissible" role="alert">
                    ${msg}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
    }

    function limparForm() {
      ['nomeSala', 'capacidade', 'tipo'].forEach(id => document.getElementById(id).value = '');
    }

    function renderLista() {
      const salas = JSON.parse(localStorage.getItem('salas') || '[]');
      const el = document.getElementById('listaSalas');

      if (!salas.length) {
        el.innerHTML = '<p class="text-secondary">Nenhuma sala cadastrada.</p>';
        return;
      }

      el.innerHTML = `
                <table class="table table-dark table-striped table-hover">
                    <thead><tr>
                        <th>Nome</th><th>Capacidade</th><th>Tipo</th>
                    </tr></thead>
                    <tbody>
                        ${salas.map(s => `
                            <tr>
                                <td>${s.nomeSala}</td>
                                <td>${s.capacidade}</td>
                                <td>${s.tipo}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
    }

    renderLista();
  </script>
</body>

</html>
