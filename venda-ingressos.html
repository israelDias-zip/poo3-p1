<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Filmes HD - Venda de Ingressos</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body data-bs-theme="dark">
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./img/iconCine.svg" alt="" class="d-inline-block align-text-top me-1">
        Mega Filmes HD
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="cadastro-filmes.html" class="nav-link">Filmes</a></li>
          <li class="nav-item"><a href="cadastro-salas.html" class="nav-link">Salas</a></li>
          <li class="nav-item"><a href="cadastro-sessoes.html" class="nav-link">Sessões</a></li>
          <li class="nav-item"><a href="venda-ingressos.html" class="nav-link active">Ingressos</a></li>
          <li class="nav-item"><a href="sessoes.html" class="nav-link">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1><span class="badge text-bg-warning">Venda de Ingressos</span></h1>
  </div>

  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Sessão</label>
        <select class="form-select" id="selectSessao">
          <option value="">Selecione uma sessão</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nome do Cliente</label>
        <input type="text" class="form-control" id="nomeCliente" placeholder="Nome completo">
      </div>
      <div class="col-md-6">
        <label class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
      </div>
      <div class="col-md-6">
        <label class="form-label">Assento</label>
        <input type="text" class="form-control" id="assento" placeholder="Ex: A10">
      </div>
      <div class="col-md-6">
        <label class="form-label">Tipo de Pagamento</label>
        <select class="form-select" id="pagamento">
          <option value="">Selecione</option>
          <option>Cartão</option>
          <option>Pix</option>
          <option>Dinheiro</option>
        </select>
      </div>
      <div class="col-12">
        <button class="btn btn-warning" onclick="confirmarVenda()">Confirmar Venda</button>
      </div>
    </div>

    <div id="alerta" class="mt-3"></div>

    <hr class="border-secondary mt-5">
    <h5 class="mt-4" style="color:#a0c878">Ingressos Vendidos</h5>
    <div id="listaIngressos" class="mt-3"></div>
  </div>

  <footer class="mt-5 py-4 border-top">
    <div class="container text-center">
      <p class="text-secondary small mb-0">&copy; 2026 Mega Filmes HD</p>
    </div>
  </footer>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/Script.js"></script>
  <script>
    carregarSessoesVenda();
    renderIngressos();
  </script>
</body>

</html>
