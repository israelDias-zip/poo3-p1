<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Filmes HD - Venda de Ingressos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body data-bs-theme="dark" class="bg-dark">

  <nav class="navbar bg-black navbar-expand-lg border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 text-warning" href="index.html">Mega Filmes HD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link text-warning">Home</a></li>
          <li class="nav-item"><a href="cadastro-filmes.html" class="nav-link text-warning">Filmes</a></li>
          <li class="nav-item"><a href="cadastro-salas.html" class="nav-link text-warning">Salas</a></li>
          <li class="nav-item"><a href="cadastro-sessoes.html" class="nav-link text-warning">Sessões</a></li>
          <li class="nav-item"><a href="venda-ingressos.html" class="nav-link text-warning active">Ingressos</a></li>
          <li class="nav-item"><a href="sessoes.html" class="nav-link text-warning">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1><span class="badge text-bg-warning">Venda de Ingressos</span></h1>
  </div>

  <div class="container mt-4">
    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label">Sessão</label>
        <select class="form-select" id="selectSessao">
          <option value="">Selecione uma sessão</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nome do Cliente</label>
        <input type="text" class="form-control" id="nomeCliente" placeholder="Nome completo">
      </div>
      <div class="col-md-6">
        <label class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" maxlength="14">
      </div>
      <div class="col-md-6">
        <label class="form-label">Assento</label>
        <input type="text" class="form-control" id="assento" placeholder="Ex: A10">
      </div>
      <div class="col-md-6">
        <label class="form-label">Tipo de Pagamento</label>
        <select class="form-select" id="pagamento">
          <option value="">Selecione</option>
          <option>Cartão</option>
          <option>Pix</option>
          <option>Dinheiro</option>
        </select>
      </div>
      <div class="col-12">
        <button class="btn btn-warning" onclick="confirmarVenda()">Confirmar Venda</button>
      </div>
    </div>

    <div id="alerta" class="mt-3"></div>

    <hr class="border-secondary mt-5">
    <h5 class="mt-4">Ingressos Vendidos</h5>
    <div id="listaIngressos" class="mt-3"></div>
  </div>

  <footer class="mt-5 py-4 border-top border-secondary">
    <div class="container text-center">
      <p class="text-secondary small mb-0">&copy; 2026 Mega Filmes HD Cinema</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function carregarSessoes() {
      const sessoes = JSON.parse(localStorage.getItem('sessoes') || '[]');
      const select = document.getElementById('selectSessao');

      const params = new URLSearchParams(window.location.search);
      const sessaoParam = params.get('sessao');

      sessoes.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.filmeTitulo} - ${s.salaNome} - ${s.dataHora.replace('T', ' ')}`;
        if (sessaoParam && s.id == sessaoParam) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function confirmarVenda() {
      const sessaoId = document.getElementById('selectSessao').value;
      const nomeCliente = document.getElementById('nomeCliente').value.trim();
      const cpf = document.getElementById('cpf').value.trim();
      const assento = document.getElementById('assento').value.trim();
      const pagamento = document.getElementById('pagamento').value;

      if (!sessaoId || !nomeCliente || !cpf || !assento || !pagamento) {
        mostrarAlerta('Preencha todos os campos.', 'danger');
        return;
      }

      const sessoes = JSON.parse(localStorage.getItem('sessoes') || '[]');
      const sessao = sessoes.find(s => s.id == sessaoId);

      const ingressos = JSON.parse(localStorage.getItem('ingressos') || '[]');
      ingressos.push({
        id: Date.now(),
        sessaoId,
        filmeTitulo: sessao.filmeTitulo,
        salaNome: sessao.salaNome,
        dataHora: sessao.dataHora,
        nomeCliente, cpf, assento, pagamento,
        preco: sessao.preco
      });

      try {
        localStorage.setItem('ingressos', JSON.stringify(ingressos));
        mostrarAlerta('Ingresso vendido com sucesso!', 'success');
        limparForm();
        renderLista();
      } catch (e) {
        mostrarAlerta('Erro ao salvar: armazenamento cheio.', 'danger');
      }
    }

    function mostrarAlerta(msg, tipo) {
      document.getElementById('alerta').innerHTML =
        `<div class="alert alert-${tipo} alert-dismissible" role="alert">
                    ${msg}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
    }

    function limparForm() {
      ['selectSessao', 'nomeCliente', 'cpf', 'assento', 'pagamento']
        .forEach(id => document.getElementById(id).value = '');
    }

    function renderLista() {
      const ingressos = JSON.parse(localStorage.getItem('ingressos') || '[]');
      const el = document.getElementById('listaIngressos');

      if (!ingressos.length) {
        el.innerHTML = '<p class="text-secondary">Nenhum ingresso vendido.</p>';
        return;
      }

      el.innerHTML = `
                <table class="table table-dark table-striped table-hover">
                    <thead><tr>
                        <th>Filme</th><th>Sala</th><th>Data e Hora</th><th>Cliente</th><th>Assento</th><th>Pagamento</th><th>Preço</th>
                    </tr></thead>
                    <tbody>
                        ${ingressos.map(i => `
                            <tr>
                                <td>${i.filmeTitulo}</td>
                                <td>${i.salaNome}</td>
                                <td>${i.dataHora.replace('T', ' ')}</td>
                                <td>${i.nomeCliente}</td>
                                <td>${i.assento}</td>
                                <td>${i.pagamento}</td>
                                <td>R$ ${parseFloat(i.preco).toFixed(2)}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
    }

    carregarSessoes();
    renderLista();
  </script>
</body>

</html>
